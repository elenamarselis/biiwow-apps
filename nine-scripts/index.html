<title>Nine Scripts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap">
<style>
/* Layout: a one-screen app shell. Sticky header with the language rail, scrolling main, bottom tab bar on phones that becomes a left rail on wide screens. */
:root{
  --bg:#fdfaf5; --surface:#ffffff; --surface2:#fbf7f1; --fg:#2e2e33; --muted:#6d6d74; --line:#e8e0d4; --line2:#f1ece3;
  --accent:#fa712d; --accent-ink:#ffffff; --accent-soft:#ffefd2; --accent-deep:#c74513;
  --gold:#9a6b10; --gold-soft:#fff1c2;
  --good:#1f7f52; --good-soft:#dcf3e6; --bad:#d13b32; --bad-soft:#fbe1de; --warn:#a56a0a;
  --heat0:#ece6db; --heat1:#fedfa4; --heat2:#fc9d2f; --heat3:#fa712d; --heat4:#ef5a1e;
  --shadow:0 1px 2px rgba(46,46,51,.06),0 8px 24px rgba(46,46,51,.08);
  --display:"Nunito",ui-rounded,"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Nunito",ui-rounded,"Noto Sans","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans JP","Noto Sans SC","Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#1a1a1e; --surface:#232329; --surface2:#2b2b32; --fg:#f2efe9; --muted:#a09a92; --line:#3a3a42; --line2:#30303a;
  --accent:#fb8a4a; --accent-ink:#1a1a1e; --accent-soft:#3d2c1c; --accent-deep:#ffb27a;
  --gold:#f2c14e; --gold-soft:#3a2d0e;
  --good:#4fc78c; --good-soft:#143326; --bad:#f07a72; --bad-soft:#3d1a18; --warn:#e3a94a;
  --heat0:#30303a; --heat1:#4a3320; --heat2:#8a4a22; --heat3:#d6602a; --heat4:#fb8a4a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1a1a1e; --surface:#232329; --surface2:#2b2b32; --fg:#f2efe9; --muted:#a09a92; --line:#3a3a42; --line2:#30303a;
  --accent:#fb8a4a; --accent-ink:#1a1a1e; --accent-soft:#3d2c1c; --accent-deep:#ffb27a;
  --gold:#f2c14e; --gold-soft:#3a2d0e;
  --good:#4fc78c; --good-soft:#143326; --bad:#f07a72; --bad-soft:#3d1a18; --warn:#e3a94a;
  --heat0:#30303a; --heat1:#4a3320; --heat2:#8a4a22; --heat3:#d6602a; --heat4:#fb8a4a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:1.8rem;line-height:1.15}
h2{font-size:1.35rem;line-height:1.2}
h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.rtl{direction:rtl;unicode-bidi:isolate}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

/* shell */
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;height:100%;min-height:0}
header.top{min-width:0;overflow:hidden;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark{display:flex;align-items:center;gap:9px;min-width:0;font-weight:800;font-size:1.25rem;letter-spacing:-.02em;line-height:1.1}
.wordmark .bwlogo{width:34px;height:34px;flex:0 0 auto;display:block}
.wordmark .bwt{display:grid;gap:2px;min-width:0}
.wordmark .bw{font-family:var(--display);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.wordmark .ii{background:linear-gradient(115deg,#fec72f,#fa712d 60%,#ff514b);-webkit-background-clip:text;background-clip:text;color:transparent}
.wordmark .app{font-weight:700;color:var(--muted);margin-left:6px}
.wordmark small{display:block;font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.wordmark .app{display:none}}
.pts{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:.82rem;font-weight:600;white-space:nowrap}
.pill.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.langs{min-width:0;display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none;-ms-overflow-style:none}
.langs::-webkit-scrollbar{display:none}
.lang{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:.85rem;font-weight:500}
.lang .g{font-size:1.05rem;line-height:1;font-weight:600}
.lang[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lang .c{font-size:.72rem;opacity:.75;font-variant-numeric:tabular-nums}
main{overflow-y:auto;min-height:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:18px}
nav.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted);border-top:2px solid transparent;margin-top:-1px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
@media (min-width:900px){
  .app{grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto 1fr}
  header.top{grid-column:1/-1}
  nav.tabs{grid-row:2;grid-column:1;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:14px 10px;gap:4px}
  nav.tabs button{flex:0;flex-direction:row;justify-content:flex-start;gap:10px;padding:10px 12px;border-radius:10px;border-top:0;margin:0;font-size:.9rem}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-deep)}
  main{grid-row:2;grid-column:2}
}

/* cards & controls */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:var(--surface2);border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:grid;gap:10px}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem;min-height:40px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-deep)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.82rem;border-radius:8px}
.btn.big{padding:14px 20px;font-size:1.05rem;min-height:52px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
label.f{display:grid;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:400;font-size:.95rem}
label.f>textarea{min-height:70px;resize:vertical}
.say{cursor:pointer;border-radius:6px;transition:background .15s}
.say:hover{background:var(--accent-soft)}
.spk{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);flex:0 0 auto}
.spk svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk.lg{width:44px;height:44px}
.target{font-size:1.25rem;font-weight:600;line-height:1.3}
.target.xl{font-size:2.6rem;line-height:1.2;font-weight:600}
.target.glyph{font-size:4.2rem;line-height:1.1}
.roman{color:var(--muted);font-style:italic}
.tag{font-size:.7rem;padding:2px 7px;border-radius:5px;background:var(--surface2);border:1px solid var(--line2);color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.tag.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);z-index:50;max-width:min(92vw,480px);text-align:center}
@media (min-width:900px){.toast{bottom:24px}}
.empty{text-align:center;padding:28px 16px;display:grid;gap:10px;justify-items:center}
.empty .big-glyph{font-family:var(--display);font-size:3rem;line-height:1;color:var(--accent);font-weight:500}
hr.sep{border:0;border-top:1px solid var(--line2);margin:4px 0}
kbd{font:inherit;font-size:.8rem;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface2)}

/* home */
.hero{display:grid;gap:14px;grid-template-columns:1fr;align-items:center}
.stat-tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.tile .v{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:.78rem;color:var(--muted);font-weight:600}
.quick{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.quick button{display:grid;gap:4px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.quick button:hover{border-color:var(--accent)}
.quick .t{font-weight:700}
.quick .d{font-size:.8rem;color:var(--muted)}

/* word list */
.wlist{display:grid;gap:8px}
.witem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.witem .main{min-width:0;display:grid;gap:1px}
.witem .en{color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.witem .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.witem .acc{font-size:.75rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.witem input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.detail{display:grid;gap:12px}
.detail .lit{padding:10px 12px;background:var(--surface2);border-radius:9px;display:grid;gap:2px}
.forms{display:grid;gap:6px}
.forms .f1{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 10px;border:1px solid var(--line2);border-radius:8px}
.forms .f1 .lab{font-size:.78rem;color:var(--muted);font-weight:600;min-width:70px}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);min-width:0}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:40;display:grid;place-items:end center;padding:0}
@media (min-width:700px){.modal-bg{place-items:center;padding:24px}}
.modal{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px;display:grid;gap:14px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{border-radius:16px}}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem}

/* play */
.play{display:grid;gap:14px;max-width:720px;margin:0 auto;width:100%}
.progress{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.playhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);font-weight:600}
.flash{perspective:1200px;min-height:300px}
.flash .inner{position:relative;width:100%;min-height:300px;transition:transform .45s;transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;place-items:center;text-align:center;gap:8px;box-shadow:var(--shadow);cursor:pointer}
.face.back{transform:rotateY(180deg);overflow-y:auto;place-items:start center;align-content:start}
.face .inner-c{display:grid;gap:8px;justify-items:center;width:100%}
.face .note{font-size:.88rem;color:var(--muted);text-align:left;max-width:52ch}
.face .lit{font-size:.9rem;padding:6px 10px;background:var(--surface2);border-radius:8px}
@media (prefers-reduced-motion:reduce){.flash .inner{transition:none}}
.answers{display:grid;gap:8px;grid-template-columns:1fr}
@media (min-width:560px){.answers{grid-template-columns:1fr 1fr}}
.ans{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;font-size:1.05rem;min-height:56px;display:flex;align-items:center;gap:10px}
.ans:hover{border-color:var(--accent)}
.ans.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.ans.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.ans.dim{opacity:.5}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 18px;text-align:center;display:grid;gap:8px;justify-items:center;box-shadow:var(--shadow)}
.typein{display:flex;gap:8px}
.typein input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.15rem;min-width:0}
.feedback{padding:12px 14px;border-radius:12px;display:grid;gap:4px}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.tile-l{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;font-weight:600;min-width:46px;text-align:center}
.tile-l.used{opacity:.25;pointer-events:none}
.memgrid{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}
@media (min-width:560px){.memgrid{grid-template-columns:repeat(5,1fr)}}
@media (min-width:760px){.memgrid{grid-template-columns:repeat(6,1fr)}}
.mem{aspect-ratio:3/4;max-width:100%;perspective:800px;background:none;border:0;padding:0}
.mem .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mem.up .in{transform:rotateY(180deg)}
.mem .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;display:grid;place-items:center;padding:6px;text-align:center;font-weight:600;font-size:.95rem;overflow:hidden;word-break:break-word}
.mem .f.fr{background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:1.6rem}
.mem .f.bk{background:var(--surface);border:1px solid var(--line);transform:rotateY(180deg)}
.mem .f.bk.long{font-size:.68rem;font-weight:500;line-height:1.2}
.mem.done .f.bk{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.timer{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.results .score{font-family:var(--display);font-size:3rem;font-weight:800;line-height:1;color:var(--accent)}
.rlist{display:grid;gap:6px}
.rlist .r{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--surface2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)}.dot.no{background:var(--bad)}

/* stats */
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--heat0)}
.heat i[data-l="1"]{background:var(--heat1)}.heat i[data-l="2"]{background:var(--heat2)}.heat i[data-l="3"]{background:var(--heat3)}.heat i[data-l="4"]{background:var(--heat4)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,1fr) 3fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar .tr{height:10px;background:var(--line2);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .tr i.bad{background:var(--bad)}
.bar .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem;min-width:52px;text-align:right}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t td.num{text-align:right}
.games{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.game{display:grid;gap:6px;text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.game:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.game .ic{font-family:var(--display);font-size:1.6rem;color:var(--accent);line-height:1;font-weight:500}
.game .t{font-weight:700;font-size:1.02rem}
.game .d{font-size:.84rem;color:var(--muted)}
.game .best{font-size:.75rem;color:var(--gold);font-weight:600}
.thinking{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-weight:600}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.3}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none}}
.preview-list{display:grid;gap:8px;max-height:50vh;overflow-y:auto;padding-right:4px}

<script>
/* ---------- data ---------- */
const LANGS = {
  ar:{name:"Arabic",native:"العربية",tts:"ar-SA",glyph:"ع",script:"arabic",rtl:true,roman:"a simple Latin transliteration with long vowels marked (ā ī ū), ʿ for ʿayn and ʾ for hamza"},
  zh:{name:"Chinese",native:"中文",tts:"zh-CN",glyph:"中",script:"han",roman:"Hanyu Pinyin with tone marks (nǐ hǎo)"},
  tr:{name:"Turkish",native:"Türkçe",tts:"tr-TR",glyph:"Tr",script:"latin"},
  hi:{name:"Hindi",native:"हिन्दी",tts:"hi-IN",glyph:"हि",script:"devanagari",roman:"a simple Latin transliteration with long vowels marked (ā ī ū) and retroflex dots (ṭ ḍ ṛ)"},
  ja:{name:"Japanese",native:"日本語",tts:"ja-JP",glyph:"日",script:"kana",roman:"Hepburn romaji with macrons (ō ū)"},
  pl:{name:"Polish",native:"Polski",tts:"pl-PL",glyph:"Pl",script:"latin"},
  hu:{name:"Hungarian",native:"Magyar",tts:"hu-HU",glyph:"Hu",script:"latin"},
  fi:{name:"Finnish",native:"Suomi",tts:"fi-FI",glyph:"Fi",script:"latin"},
  no:{name:"Norwegian",native:"Norsk",tts:"nb-NO",glyph:"No",script:"latin"},
  it:{name:"Italian",native:"Italiano",tts:"it-IT",glyph:"It",script:"latin"},
  es:{name:"Spanish",native:"Español",tts:"es-ES",glyph:"Es",script:"latin"},
  fr:{name:"French",native:"Français",tts:"fr-FR",glyph:"Fr",script:"latin"},
  nl:{name:"Dutch",native:"Nederlands",tts:"nl-NL",glyph:"Nl",script:"latin"},
  en:{name:"English C2",native:"English",tts:"en-GB",glyph:"C2",script:"latin",c2:true}
};
const LANG_ORDER = ["pl","hu","fi","no","tr","it","es","fr","nl","ar","hi","ja","zh","en"];
const TOPICS_EN=["Phrasal verbs: everyday life","Phrasal verbs: work & business","Idioms & fixed expressions","Formal & academic vocabulary","Describing people & character","Emotions & attitudes","Argument, debate & persuasion","Business, money & finance","Law, politics & society","Science & technology","Literature, media & the arts","Near-synonyms & nuance","Collocations that sound native","Latin & Greek roots","Adverbs & discourse markers","Humour, irony & register","Food, travel & lifestyle","Nature, environment & weather","Health, body & medicine","Rare but useful words"];
const topicsFor=lang=>lang==="en"?TOPICS_EN:TOPICS;
const sideLabel=(lang,side)=>{const L=LANGS[lang];if(L.c2)return side==="t"?"Word":"Meaning";return side==="t"?L.name:"English";};
const TOPICS = ["Greetings","Numbers & counting","Family & people","Food & drink","At the café and restaurant","Travel & directions","Transport","Time, days & months","Colours & shapes","Body & health","At home","Clothes","Work & study","Weather & nature","Shopping & money","Feelings","Verbs of daily life","Question words & small words","Adjectives for describing people","Animals","City & places","Hobbies & free time","Phrases for emergencies","Polite phrases & small talk","Love & friendship","Technology & phone"];
const GAMES = {
  flash:{name:"Flashcards",icon:"⧉",desc:"Flip a card, grade yourself. The classic, both directions.",base:10},
  quiz:{name:"Four choices",icon:"¼",desc:"Pick the right meaning or the right word out of four.",base:10},
  type:{name:"Type it",icon:"⌨",desc:"Write the word yourself. Script or transliteration both count.",base:15},
  listen:{name:"Listen & pick",icon:"♪",desc:"Hear the word, then pick what you heard. Trains your ear.",base:12},
  scramble:{name:"Unscramble",icon:"⇄",desc:"Rebuild the word from its shuffled letters or syllables.",base:12},
  memory:{name:"Memory match",icon:"▦",desc:"Face-down pairs: word and meaning. Timed, best time kept.",base:5},
  blitz:{name:"Blitz 60",icon:"⚡",desc:"Sixty seconds, as many right answers as you can.",base:10},
  forms:{name:"Forms & genders",icon:"♀♂",desc:"Masculine or feminine, and verb conjugations.",base:15}
};
const SIZES=[10,20,30,40,50];
const STARTER = [{"id":"s_pl_01","lang":"pl","type":"phrase","en":"Good day / Hello (formal)","target":"Dzień dobry","literal":"day good","note":"The adjective follows the noun in this fixed greeting, the reverse of everyday Polish word order. Used from morning until early evening; after dark Poles switch to 'Dobry wieczór'.","pos":"greeting","topic":"Greetings"},
{"id":"s_pl_02","lang":"pl","type":"word","en":"Thank you","target":"Dziękuję","literal":"I thank","note":"A first-person verb, not a noun: you are literally saying 'I thank'. The root came into Old Polish from Czech, which borrowed it from Old High German 'dankōn', the same source as English 'thank'.","pos":"verb","topic":"Greetings"},
{"id":"s_pl_03","lang":"pl","type":"word","en":"Please / Here you are / You're welcome","target":"Proszę","literal":"I ask","note":"One word does three jobs. It is the verb 'prosić' (to ask) in the first person, so 'please' is really 'I request', and handing something over or answering thanks is also framed as a polite request.","pos":"verb","topic":"Greetings"},
{"id":"s_pl_04","lang":"pl","type":"word","en":"Sorry / Excuse me","target":"Przepraszam","literal":"I ask across","note":"Built from the prefix 'prze-' (through, across) and 'prosić' (to ask). Apologizing is pictured as asking your way back across a line you crossed.","pos":"verb","topic":"Greetings"},
{"id":"s_pl_05","lang":"pl","type":"phrase","en":"Goodbye","target":"Do widzenia","literal":"until seeing","note":"'Do' (until) plus 'widzenie' (the act of seeing) in the genitive case, which 'do' always demands. The same pattern gives 'do jutra' (until tomorrow) and 'do zobaczenia' (until we see each other).","pos":"greeting","topic":"Greetings"},
{"id":"s_pl_06","lang":"pl","type":"word","en":"Enjoy your meal","target":"Smacznego","literal":"of (something) tasty","note":"The genitive of 'smaczny' (tasty). It is the tail of 'życzę smacznego' (I wish you something tasty), with the verb dropped. Wishes in Polish take the genitive, so the ending stays even when the verb goes.","pos":"wish","topic":"Food & drink"},
{"id":"s_pl_07","lang":"pl","type":"word","en":"Good night","target":"Dobranoc","literal":"good-night","note":"'Dobra noc' fused into one word over centuries of use. Compare 'Dobry wieczór' (good evening), which stayed two words.","pos":"greeting","topic":"Greetings"},
{"id":"s_pl_08","lang":"pl","type":"word","en":"Teacher","target":"nauczyciel","literal":"one who teaches","note":"From 'nauczyć' (to teach), itself from 'uczyć' with the perfective prefix 'na-'. The feminine adds '-ka', the most productive feminine suffix in Polish.","pos":"noun","topic":"Work & study","gender":{"m":{"target":"nauczyciel"},"f":{"target":"nauczycielka"}}},
{"id":"s_pl_09","lang":"pl","type":"word","en":"To be","target":"być","literal":"to be","note":"The present tense is irregular and descends from two different Proto-Indo-European roots: 'jest-' forms (cognate with English 'is') and 'być' (cognate with 'be'). Polish usually drops the pronoun because the ending already tells you who.","pos":"verb","topic":"Verbs of daily life","conj":[{"label":"I","target":"jestem"},{"label":"you (sg.)","target":"jesteś"},{"label":"he / she / it","target":"jest"},{"label":"we","target":"jesteśmy"},{"label":"you (pl.)","target":"jesteście"},{"label":"they","target":"są"}]},
{"id":"s_hu_01","lang":"hu","type":"word","en":"Hi / Bye (informal)","target":"Szia","literal":"(your) servant","note":"A worn-down form of 'szervusz', from Latin 'servus' (servant), the old Austro-Hungarian greeting 'your humble servant'. The same root gives 'servus' in Austria and 'serwus' in Poland. Works for hello and goodbye alike.","pos":"greeting","topic":"Greetings"},
{"id":"s_hu_02","lang":"hu","type":"phrase","en":"Good day","target":"Jó napot kívánok","literal":"good day-(object) I-wish","note":"'Napot' carries the accusative ending '-t' because the day is the object of 'kívánok' (I wish). Even when people drop the verb and say just 'Jó napot', the ending stays, a fossil of the full sentence.","pos":"greeting","topic":"Greetings"},
{"id":"s_hu_03","lang":"hu","type":"word","en":"Thank you","target":"Köszönöm","literal":"I thank it","note":"The '-öm' ending is the definite conjugation, used when the verb has a specific object. So the word quietly includes 'it': I thank (this specific thing). 'Köszönöm szépen' adds 'nicely' for 'thank you very much'.","pos":"verb","topic":"Greetings"},
{"id":"s_hu_04","lang":"hu","type":"word","en":"Please / You're welcome","target":"Kérem","literal":"I ask it","note":"Like Polish 'proszę', the verb 'kérni' (to ask for) in the first person with a definite object. 'Kérem szépen' is the polite form; 'légy szíves' (be so kind) is the informal one.","pos":"verb","topic":"Greetings"},
{"id":"s_hu_05","lang":"hu","type":"word","en":"Goodbye (formal)","target":"Viszontlátásra","literal":"onto again-seeing","note":"Three pieces glued together: 'viszont' (again, in return) + 'látás' (seeing) + '-ra' (onto). Hungarian builds words by stacking suffixes, which is why single words can be this long. Informally people say 'Viszlát'.","pos":"greeting","topic":"Greetings"},
{"id":"s_hu_06","lang":"hu","type":"word","en":"Cheers / Bless you","target":"Egészségedre","literal":"onto your health","note":"'Egészség' (health) comes from 'egész' (whole): to be healthy is to be whole. '-ed' marks 'your' and '-re' means 'onto'. Said when clinking glasses and when someone sneezes.","pos":"wish","topic":"Food & drink"},
{"id":"s_hu_07","lang":"hu","type":"word","en":"Friend","target":"barát","literal":"friend","note":"Hungarian has no grammatical gender at all, not even he/she ('ő' covers both). To specify a female friend you add 'nő' (woman), giving 'barátnő', which in practice usually means girlfriend.","pos":"noun","topic":"Family & people","gender":{"m":{"target":"barát"},"f":{"target":"barátnő"}}},
{"id":"s_hu_08","lang":"hu","type":"word","en":"To be","target":"lenni","literal":"to be","note":"The third person 'van' is dropped in simple 'X is Y' sentences: 'Ő tanár' means 'he/she is a teacher' with no verb at all. 'Van' reappears for location and existence.","pos":"verb","topic":"Verbs of daily life","conj":[{"label":"I","target":"vagyok"},{"label":"you (sg.)","target":"vagy"},{"label":"he / she / it","target":"van"},{"label":"we","target":"vagyunk"},{"label":"you (pl.)","target":"vagytok"},{"label":"they","target":"vannak"}]},
{"id":"s_hu_09","lang":"hu","type":"word","en":"Water","target":"víz","literal":"water","note":"One of the oldest words in the language, inherited from Proto-Uralic and related to Finnish 'vesi'. The long 'í' shortens when suffixes are added: 'vizet' (water, object), 'vizek' (waters).","pos":"noun","topic":"Food & drink"},
{"id":"s_fi_01","lang":"fi","type":"word","en":"Hi","target":"Moi","literal":"hi","note":"Everyday greeting, especially in Helsinki. Usually traced to Low German or Swedish 'moin', brought by sailors and traders through the Baltic ports. 'Hei' is the neutral alternative; 'Moi moi' is goodbye.","pos":"greeting","topic":"Greetings"},
{"id":"s_fi_02","lang":"fi","type":"word","en":"Thank you","target":"Kiitos","literal":"thanks","note":"Finnish has no everyday word for 'please'. 'Kiitos' does the job instead: 'Kahvi, kiitos' (coffee, thanks) is how you ask politely. From the verb 'kiittää' (to thank, to praise).","pos":"noun","topic":"Greetings"},
{"id":"s_fi_03","lang":"fi","type":"phrase","en":"Good day","target":"Hyvää päivää","literal":"good day (partial)","note":"Both words carry the partitive ending '-ä'. Wishes in Finnish go in the partitive because you are wishing an open-ended, unmeasured amount of a good day, not one whole specific day.","pos":"greeting","topic":"Greetings"},
{"id":"s_fi_04","lang":"fi","type":"word","en":"Goodbye","target":"Näkemiin","literal":"into (future) seeings","note":"From 'näkemä' (a seeing) with the plural illative ending '-iin' (into). So goodbye is 'into the seeings to come'. Compare 'kuulemiin' (goodbye on the phone, literally 'into hearings').","pos":"greeting","topic":"Greetings"},
{"id":"s_fi_05","lang":"fi","type":"word","en":"Sorry / Excuse me","target":"Anteeksi","literal":"into forgiveness","note":"A case form of an old word for pardon, frozen into an interjection. The full verb is 'antaa anteeksi' (to forgive), literally 'to give into pardon'.","pos":"interjection","topic":"Greetings"},
{"id":"s_fi_06","lang":"fi","type":"phrase","en":"Please / You're welcome / Here you are","target":"Ole hyvä","literal":"be good","note":"An imperative: 'be good'. Said when handing something over and as the reply to 'kiitos'. The plural or polite form is 'Olkaa hyvä'.","pos":"phrase","topic":"Greetings"},
{"id":"s_fi_07","lang":"fi","type":"word","en":"King","target":"kuningas","literal":"king","note":"A very old Germanic loan, from Proto-Germanic 'kuningaz', the ancestor of English 'king'. Finnish kept the ending that the Germanic languages later wore away. The feminine suffix '-tar' gives 'kuningatar' (queen).","pos":"noun","topic":"Family & people","gender":{"m":{"target":"kuningas"},"f":{"target":"kuningatar"}}},
{"id":"s_fi_08","lang":"fi","type":"word","en":"To be","target":"olla","literal":"to be","note":"Finnish has no gender even in pronouns: 'hän' is he or she. The verb endings mark the person, so 'olen' alone already means 'I am'.","pos":"verb","topic":"Verbs of daily life","conj":[{"label":"I","target":"olen"},{"label":"you (sg.)","target":"olet"},{"label":"he / she","target":"on"},{"label":"we","target":"olemme"},{"label":"you (pl.)","target":"olette"},{"label":"they","target":"ovat"}]},
{"id":"s_fi_09","lang":"fi","type":"word","en":"Perseverance, grit","target":"sisu","literal":"inner (stuff)","note":"From 'sisä-' (inside, inner). A national idea more than a word: stubborn courage that keeps going after hope is gone. There is no single English equivalent, which is why it is usually left untranslated.","pos":"noun","topic":"Feelings"},
{"id":"s_no_01","lang":"no","type":"word","en":"Hi","target":"Hei","literal":"hi","note":"The all-purpose greeting, used with everyone from friends to the bank clerk. Doubled, 'Hei hei', it is a cheerful goodbye. Norway dropped most formal address in the 1970s, so 'hei' replaced older 'god dag' in daily life.","pos":"greeting","topic":"Greetings"},
{"id":"s_no_02","lang":"no","type":"word","en":"Thanks","target":"Takk","literal":"thanks","note":"Norwegians thank for everything: 'takk for maten' (thanks for the food) after a meal, 'takk for sist' (thanks for last time) when you meet again. 'Tusen takk' is 'a thousand thanks'.","pos":"noun","topic":"Greetings"},
{"id":"s_no_03","lang":"no","type":"phrase","en":"Bye","target":"Ha det bra","literal":"have it good","note":"'Ha det' (have it) is the short form. The 'it' is your life or your time: have it good while we are apart.","pos":"greeting","topic":"Greetings"},
{"id":"s_no_04","lang":"no","type":"word","en":"Sorry / Excuse me","target":"Unnskyld","literal":"un-guilt","note":"'Unn-' (away, un-) plus 'skyld' (guilt, debt). Apologizing asks to be freed from a debt, the same picture as German 'Entschuldigung'.","pos":"interjection","topic":"Greetings"},
{"id":"s_no_05","lang":"no","type":"phrase","en":"Please","target":"Vær så snill","literal":"be so kind","note":"Norwegian has no single word for please. 'Vær så snill' is a request to be kind; when offering something you say 'vær så god' (be so good) instead.","pos":"phrase","topic":"Greetings"},
{"id":"s_no_06","lang":"no","type":"word","en":"Cosy, warm and pleasant","target":"koselig","literal":"cosy-ish","note":"From 'kos' (cosiness, comfort). Describes candles, woollen socks, a cabin evening or a good conversation. Close cousin of Danish 'hyggelig'.","pos":"adjective","topic":"Feelings"},
{"id":"s_no_07","lang":"no","type":"word","en":"Friend","target":"venn","literal":"friend","note":"Bokmål has three genders, but person nouns are usually masculine with a feminine formed by '-inne', a suffix borrowed from Low German. 'Venninne' means a female friend, not a girlfriend ('kjæreste').","pos":"noun","topic":"Family & people","gender":{"m":{"target":"venn"},"f":{"target":"venninne"}}},
{"id":"s_no_08","lang":"no","type":"word","en":"To be","target":"å være","literal":"to be","note":"Norwegian verbs do not change for person: 'jeg er', 'du er', 'vi er' all use the same form. The work goes into tense instead. 'Er' and English 'are' are the same old word.","pos":"verb","topic":"Verbs of daily life","conj":[{"label":"present (all persons)","target":"er"},{"label":"past","target":"var"},{"label":"perfect","target":"har vært"},{"label":"future","target":"skal være"}]},
{"id":"s_no_09","lang":"no","type":"phrase","en":"Thanks for the food","target":"Takk for maten","literal":"thanks for the-food","note":"Said to the host when you leave the table, almost without exception. 'Maten' is 'mat' (food) with the definite article '-en' glued to the end, which is how Scandinavian languages say 'the'.","pos":"phrase","topic":"Food & drink"},
{"id":"s_tr_01","lang":"tr","type":"word","en":"Hello","target":"Merhaba","literal":"welcome, (you are in) a spacious place","note":"Borrowed from Arabic 'marḥaban', from the root r-ḥ-b meaning 'wide, spacious'. Greeting someone is telling them there is room for them. Turkish absorbed thousands of Arabic words through Ottoman times.","pos":"greeting","topic":"Greetings"},
{"id":"s_tr_02","lang":"tr","type":"phrase","en":"Thank you","target":"Teşekkür ederim","literal":"thanks I-make","note":"'Teşekkür' is Arabic 'tashakkur' (thanking); 'ederim' is 'I do'. Turkish often builds verbs by pairing a borrowed noun with 'etmek' (to do). The shorter 'Teşekkürler' and 'Sağ ol' (be healthy) are casual.","pos":"phrase","topic":"Greetings"},
{"id":"s_tr_03","lang":"tr","type":"word","en":"Please","target":"Lütfen","literal":"kindly, with grace","note":"From Arabic 'luṭf' (kindness, grace) with the Arabic adverb ending '-an'. Turkish spells it with its own vowel harmony as 'lütfen'.","pos":"adverb","topic":"Greetings"},
{"id":"s_tr_04","lang":"tr","type":"word","en":"Good morning","target":"Günaydın","literal":"day bright","note":"'Gün' (day) plus 'aydın' (bright, enlightened). A native Turkish compound, coined in the language reform era to replace the Arabic-Persian 'sabah-ı şerif'.","pos":"greeting","topic":"Greetings"},
{"id":"s_tr_05","lang":"tr","type":"phrase","en":"Goodbye (said by the one leaving)","target":"Hoşça kal","literal":"stay pleasantly","note":"Only the person leaving says this; the person staying answers 'Güle güle'. 'Hoş' is Persian for pleasant; '-ça' makes it an adverb; 'kal' is the command 'stay'.","pos":"greeting","topic":"Greetings"},
{"id":"s_tr_06","lang":"tr","type":"phrase","en":"Goodbye (said to the one leaving)","target":"Güle güle","literal":"laughing, laughing","note":"A doubled form of 'gülmek' (to laugh): go off laughing. The same doubling pattern gives 'yavaş yavaş' (slowly) and 'koşa koşa' (running).","pos":"greeting","topic":"Greetings"},
{"id":"s_tr_07","lang":"tr","type":"phrase","en":"May it come easy (said to someone working)","target":"Kolay gelsin","literal":"easy let-it-come","note":"Said to anyone at work, from a shopkeeper to a road crew. 'Gelsin' is the third-person command of 'gelmek' (to come). There is no English equivalent; it acknowledges effort rather than greeting.","pos":"phrase","topic":"Work & study"},
{"id":"s_tr_08","lang":"tr","type":"word","en":"King","target":"kral","literal":"king","note":"Turkish has no grammatical gender; 'o' means he, she and it. 'Kral' is a Slavic loan ('kralj'), ultimately from the name Charlemagne (Karl). 'Kraliçe' (queen) took the Slavic feminine ending '-ica' along with it.","pos":"noun","topic":"Family & people","gender":{"m":{"target":"kral"},"f":{"target":"kraliçe"}}},
{"id":"s_tr_09","lang":"tr","type":"word","en":"To come","target":"gelmek","literal":"to come","note":"Suffixes stack onto the stem 'gel-' and every vowel in them obeys vowel harmony, matching the front vowel 'e'. Present continuous '-iyor' is the everyday present tense.","pos":"verb","topic":"Verbs of daily life","conj":[{"label":"I","target":"geliyorum"},{"label":"you (sg.)","target":"geliyorsun"},{"label":"he / she / it","target":"geliyor"},{"label":"we","target":"geliyoruz"},{"label":"you (pl.)","target":"geliyorsunuz"},{"label":"they","target":"geliyorlar"}]},
{"id":"s_ar_01","lang":"ar","type":"word","en":"Hello","target":"مرحبا","roman":"marḥaban","literal":"welcome, (there is) room","note":"From the root r-ḥ-b, 'to be wide'. The '-an' ending is the accusative 'tanwīn', which turns nouns into adverb-like exclamations. The same root is behind Turkish 'merhaba'.","pos":"greeting","topic":"Greetings"},
{"id":"s_ar_02","lang":"ar","type":"word","en":"Thank you","target":"شكرا","roman":"shukran","literal":"thankfully","note":"'Shukr' (thanks) plus the accusative ending '-an', written with two fatḥa strokes above the final alif. Many Arabic interjections are frozen accusatives of this kind: 'ahlan' (welcome), 'ṭabʿan' (of course).","pos":"noun","topic":"Greetings"},
{"id":"s_ar_03","lang":"ar","type":"phrase","en":"Please","target":"من فضلك","roman":"min faḍlik","literal":"from your grace","note":"'Min' (from) + 'faḍl' (bounty, favour) + 'your'. You ask for something out of the other person's generosity. The final vowel changes with the listener's gender, which is written only in vowelled texts.","pos":"phrase","topic":"Greetings","gender":{"m":{"target":"من فضلكَ","roman":"min faḍlika"},"f":{"target":"من فضلكِ","roman":"min faḍliki"}}},
{"id":"s_ar_04","lang":"ar","type":"phrase","en":"Peace be upon you (hello)","target":"السلام عليكم","roman":"as-salāmu ʿalaykum","literal":"the-peace upon-you (pl.)","note":"The reply is 'wa ʿalaykumu s-salām' (and upon you peace). The 'al-' of 'as-salām' assimilates to the 's' that follows, which is why it is written 'al' but pronounced 'as'. 'Salām' shares a root with 'Islam' and 'muslim': s-l-m, wholeness and peace.","pos":"greeting","topic":"Greetings"},
{"id":"s_ar_05","lang":"ar","type":"phrase","en":"Goodbye","target":"مع السلامة","roman":"maʿa s-salāma","literal":"with the-safety","note":"Said to the person leaving: go with safety. The one leaving may answer 'Allāh yusallimak' (God keep you safe).","pos":"greeting","topic":"Greetings"},
{"id":"s_ar_06","lang":"ar","type":"phrase","en":"God willing / hopefully","target":"إن شاء الله","roman":"in shāʾ Allāh","literal":"if God willed","note":"Three words: 'in' (if), 'shāʾa' (he willed), 'Allāh'. Used for any future plan, from the solemn to 'the bus will come, inshallah'. Often written as one word in casual Latin script.","pos":"phrase","topic":"Greetings"},
{"id":"s_ar_07","lang":"ar","type":"word","en":"Come on / Let's go","target":"يلا","roman":"yalla","literal":"O God","note":"Colloquial, from 'yā Allāh' (O God) worn down by speed. Heard across the Arab world and borrowed into Hebrew, Turkish and Greek slang.","pos":"interjection","topic":"Greetings"},
{"id":"s_ar_08","lang":"ar","type":"word","en":"Student","target":"طالب","roman":"ṭālib","literal":"one who seeks","note":"The active participle of 'ṭalaba' (to seek, to request): a student is a seeker. The feminine adds 'tāʾ marbūṭa' (ة), the looped letter that marks almost every feminine noun. 'Taliban' is the Pashto plural of this same word.","pos":"noun","topic":"Work & study","gender":{"m":{"target":"طالب","roman":"ṭālib"},"f":{"target":"طالبة","roman":"ṭāliba"}}},
{"id":"s_ar_09","lang":"ar","type":"word","en":"To write (he wrote)","target":"كتب","roman":"kataba","literal":"he wrote","note":"The three-letter root k-t-b carries the idea of writing. Change the vowels and affixes and you get 'kitāb' (book), 'maktab' (office), 'maktaba' (library), 'kātib' (writer). Arabic dictionaries are organized by root, not alphabetically by word.","pos":"verb","topic":"Verbs of daily life","conj":[{"label":"I","target":"كتبتُ","roman":"katabtu"},{"label":"you (m.)","target":"كتبتَ","roman":"katabta"},{"label":"you (f.)","target":"كتبتِ","roman":"katabti"},{"label":"he","target":"كتبَ","roman":"kataba"},{"label":"she","target":"كتبتْ","roman":"katabat"},{"label":"we","target":"كتبنا","roman":"katabnā"}]},
{"id":"s_hi_01","lang":"hi","type":"word","en":"Hello / Goodbye","target":"नमस्ते","roman":"namaste","literal":"bow to-you","note":"Sanskrit 'namas' (a bow, reverence) + 'te' (to you). The gesture of joined palms is the bow the word describes. 'Namaskār' is the slightly more formal variant.","pos":"greeting","topic":"Greetings"},
{"id":"s_hi_02","lang":"hi","type":"word","en":"Thank you","target":"धन्यवाद","roman":"dhanyavād","literal":"blessed-speech","note":"Sanskrit 'dhanya' (blessed, fortunate) + 'vāda' (speech): to call someone blessed. A formal word; in daily life people say 'shukriyā' or simply 'thank you'. Thanking family for small things can feel oddly distant in Hindi culture.","pos":"noun","topic":"Greetings"},
{"id":"s_hi_03","lang":"hi","type":"word","en":"Thanks (everyday)","target":"शुक्रिया","roman":"shukriyā","literal":"thanks","note":"The same Arabic root as 'shukran', arriving through Persian and Urdu. Hindi vocabulary runs on two tracks: Sanskrit-derived words like 'dhanyavād' and Perso-Arabic ones like this.","pos":"noun","topic":"Greetings"},
{"id":"s_hi_04","lang":"hi","type":"word","en":"Please","target":"कृपया","roman":"kṛpayā","literal":"by kindness","note":"The instrumental case of Sanskrit 'kṛpā' (compassion, grace). Mostly heard in announcements and signs; in conversation politeness is carried by the verb ending '-ie' instead ('dījie', please give).","pos":"adverb","topic":"Greetings"},
{"id":"s_hi_05","lang":"hi","type":"phrase","en":"See you again","target":"फिर मिलेंगे","roman":"phir milenge","literal":"again we-will-meet","note":"'Phir' (again) + 'milenge' (we will meet). Hindi has no dedicated word for goodbye; 'namaste' or this future-tense promise does the job.","pos":"phrase","topic":"Greetings"},
{"id":"s_hi_06","lang":"hi","type":"phrase","en":"Sorry / Excuse me","target":"माफ़ कीजिए","roman":"māf kījie","literal":"forgiveness do-please","note":"'Māf' is Arabic 'muʿāf' (pardoned); 'kījie' is the polite command of 'karnā' (to do). The dot under फ़ marks the 'f' sound, a letter added to Devanagari for Perso-Arabic loans.","pos":"phrase","topic":"Greetings"},
{"id":"s_hi_07","lang":"hi","type":"word","en":"Good / Okay / Really?","target":"अच्छा","roman":"acchā","literal":"good","note":"An adjective that also works as 'okay', 'I see', and with rising tone 'really?'. As an adjective it agrees with gender: 'acchā laṛkā' (good boy), 'acchī laṛkī' (good girl).","pos":"adjective","topic":"Feelings","gender":{"m":{"target":"अच्छा","roman":"acchā"},"f":{"target":"अच्छी","roman":"acchī"}}},
{"id":"s_hi_08","lang":"hi","type":"word","en":"Boy / Girl","target":"लड़का","roman":"laṛkā","literal":"boy","note":"The classic masculine '-ā' / feminine '-ī' pair. Most Hindi nouns ending in '-ā' are masculine and swap to '-ī' for the feminine; adjectives follow the same rule.","pos":"noun","topic":"Family & people","gender":{"m":{"target":"लड़का","roman":"laṛkā"},"f":{"target":"लड़की","roman":"laṛkī"}}},
{"id":"s_hi_09","lang":"hi","type":"word","en":"To be","target":"होना","roman":"honā","literal":"to be","note":"Hindi has three levels of 'you': 'tū' (intimate), 'tum' (familiar), 'āp' (respectful), each with its own verb form. 'Āp' takes the plural form 'hain' even for one person, a mark of respect.","pos":"verb","topic":"Verbs of daily life","conj":[{"label":"I","target":"मैं हूँ","roman":"main hūn"},{"label":"you (familiar)","target":"तुम हो","roman":"tum ho"},{"label":"you (respectful)","target":"आप हैं","roman":"āp hain"},{"label":"he / she","target":"वह है","roman":"vah hai"},{"label":"we","target":"हम हैं","roman":"ham hain"},{"label":"they","target":"वे हैं","roman":"ve hain"}]},
{"id":"s_ja_01","lang":"ja","type":"word","en":"Hello (daytime)","target":"こんにちは","roman":"konnichiwa","literal":"as for this day...","note":"The tail of an old sentence, '今日はご機嫌いかがですか' (as for today, how are you?). Only the topic 'today' plus the particle 'wa' survived. That is why it is spelled with は (the particle) and not わ, even though it is pronounced 'wa'.","pos":"greeting","topic":"Greetings"},
{"id":"s_ja_02","lang":"ja","type":"word","en":"Thank you","target":"ありがとう","roman":"arigatō","literal":"(it is) hard to exist","note":"From 有り難い 'arigatai': 'ari' (to exist) + 'gatai' (difficult). A kindness is something rare, hard to come by. Add ございます for the polite form.","pos":"interjection","topic":"Greetings"},
{"id":"s_ja_03","lang":"ja","type":"word","en":"Excuse me / Sorry / Thanks","target":"すみません","roman":"sumimasen","literal":"it does not settle","note":"The negative of 済む 'sumu' (to be settled, to be finished). The feeling is that your debt to the other person is not settled. Used to get attention, to apologize, and to thank someone for trouble taken.","pos":"interjection","topic":"Greetings"},
{"id":"s_ja_04","lang":"ja","type":"phrase","en":"Good morning","target":"おはようございます","roman":"ohayō gozaimasu","literal":"it is honorably early","note":"'O-' is an honorific prefix, 'hayō' is an old form of 早い 'hayai' (early), 'gozaimasu' is the polite 'is'. Literally praising the earliness of the hour. Friends shorten it to 'ohayō'.","pos":"greeting","topic":"Greetings"},
{"id":"s_ja_05","lang":"ja","type":"word","en":"Goodbye (for a while)","target":"さようなら","roman":"sayōnara","literal":"if that is so","note":"From 左様なら 'sayō naraba': 'if it is that way, then...'. The rest of the sentence ('then we part') was left unsaid. It sounds final, so for 'see you later' Japanese prefer 'ja ne' or 'mata ne'.","pos":"greeting","topic":"Greetings"},
{"id":"s_ja_06","lang":"ja","type":"word","en":"Said before eating","target":"いただきます","roman":"itadakimasu","literal":"I humbly receive","note":"The humble form of 'to receive', originally 'to lift above one's head', the gesture for accepting a gift from a superior. Thanks the cook, the farmer and the food itself. 'Gochisōsama' closes the meal.","pos":"phrase","topic":"Food & drink"},
{"id":"s_ja_07","lang":"ja","type":"word","en":"Thanks for your hard work","target":"おつかれさま","roman":"otsukaresama","literal":"honorable tiredness","note":"'O-' (honorific) + 'tsukare' (tiredness) + 'sama' (a respectful title). You are addressing the other person's fatigue with respect. The standard sign-off among colleagues at the end of the day.","pos":"phrase","topic":"Work & study"},
{"id":"s_ja_08","lang":"ja","type":"word","en":"I (me)","target":"私","roman":"watashi","literal":"private (self)","note":"Japanese has no grammatical gender, but 'I' changes with the speaker: 'boku' is typical for men and boys, 'atashi' is feminine and casual, 'watashi' is neutral and polite. The kanji 私 also means 'private'.","pos":"pronoun","topic":"Family & people","gender":{"m":{"target":"僕","roman":"boku"},"f":{"target":"あたし","roman":"atashi"}}},
{"id":"s_ja_09","lang":"ja","type":"word","en":"To eat","target":"食べる","roman":"taberu","literal":"to eat","note":"A regular 'ru-verb': drop る and add endings. Japanese verbs do not change for person or number, only for tense, politeness and mood. 食 is the kanji for food, seen in 食事 (meal) and 食堂 (canteen).","pos":"verb","topic":"Verbs of daily life","conj":[{"label":"polite","target":"食べます","roman":"tabemasu"},{"label":"negative","target":"食べない","roman":"tabenai"},{"label":"past","target":"食べた","roman":"tabeta"},{"label":"te-form","target":"食べて","roman":"tabete"},{"label":"volitional (let's)","target":"食べよう","roman":"tabeyō"},{"label":"potential (can)","target":"食べられる","roman":"taberareru"}]},
{"id":"s_zh_01","lang":"zh","type":"word","en":"Hello","target":"你好","roman":"nǐ hǎo","literal":"you good","note":"'Nǐ' (you) + 'hǎo' (good). 好 is a woman 女 beside a child 子, an old picture of what is good. Two third tones in a row change the first to a rising tone, so it sounds like 'ní hǎo'.","pos":"greeting","topic":"Greetings"},
{"id":"s_zh_02","lang":"zh","type":"word","en":"Thank you","target":"谢谢","roman":"xièxie","literal":"thank thank","note":"谢 originally meant 'to decline, to excuse oneself' and drifted to 'thank'. Doubling a verb in Chinese softens it and makes it casual, so 谢谢 is lighter than 谢 alone. The second syllable loses its tone.","pos":"verb","topic":"Greetings"},
{"id":"s_zh_03","lang":"zh","type":"word","en":"Please","target":"请","roman":"qǐng","literal":"to invite, to request","note":"A verb: 'I invite you to...'. 请坐 is 'please sit', 请问 (please-ask) opens a polite question. The traditional form 請 shows the speech radical 言 beside 青.","pos":"verb","topic":"Greetings"},
{"id":"s_zh_04","lang":"zh","type":"word","en":"Sorry","target":"对不起","roman":"duìbuqǐ","literal":"face not able","note":"对 (to face) + 不 (not) + 起 (rise, manage to): 'I cannot face you'. A serious apology. For small things like bumping into someone, 不好意思 (bù hǎoyìsi, 'embarrassed') is more common.","pos":"phrase","topic":"Greetings"},
{"id":"s_zh_05","lang":"zh","type":"word","en":"Goodbye","target":"再见","roman":"zàijiàn","literal":"again see","note":"再 (again) + 见 (see), exactly parallel to French 'au revoir'. 见 is a simplified form of 見, a large eye 目 on legs.","pos":"greeting","topic":"Greetings"},
{"id":"s_zh_06","lang":"zh","type":"phrase","en":"It's okay / No problem","target":"没关系","roman":"méi guānxi","literal":"no connection","note":"关系 'guānxi' means relationship or connection, the famous word for personal networks. 'No connection' means 'it has no bearing, don't worry'. The reply to 对不起.","pos":"phrase","topic":"Greetings"},
{"id":"s_zh_07","lang":"zh","type":"word","en":"Come on! / Go!","target":"加油","roman":"jiāyóu","literal":"add oil","note":"'Add fuel', as in refuelling a car or feeding a lamp. Shouted at sports events and said to friends before exams. It became so widely used that 'add oil' entered the Oxford English Dictionary in 2018.","pos":"phrase","topic":"Feelings"},
{"id":"s_zh_08","lang":"zh","type":"word","en":"He / She","target":"他","roman":"tā","literal":"he","note":"Spoken Chinese has one word 'tā' for he, she and it. The written feminine 她 with the woman radical 女 was invented around 1920 by the poet Liu Bannong to translate Western pronouns; before that 他 covered everyone.","pos":"pronoun","topic":"Family & people","gender":{"m":{"target":"他","roman":"tā"},"f":{"target":"她","roman":"tā"}}},
{"id":"s_zh_09","lang":"zh","type":"word","en":"To be","target":"是","roman":"shì","literal":"to be","note":"Chinese verbs never conjugate: 是 is the same for every person and every tense. Time is shown by context words like 昨天 (yesterday) or particles like 了. Note that adjectives do not take 是: 'I am tired' is 我很累, with no 'is'.","pos":"verb","topic":"Verbs of daily life","conj":[{"label":"I am","target":"我是","roman":"wǒ shì"},{"label":"you are","target":"你是","roman":"nǐ shì"},{"label":"he / she is","target":"他是","roman":"tā shì"},{"label":"we are","target":"我们是","roman":"wǒmen shì"},{"label":"they are","target":"他们是","roman":"tāmen shì"}]},
{"id":"s_zh_10","lang":"zh","type":"word","en":"So-so","target":"马马虎虎","roman":"mǎmǎhūhū","literal":"horse horse tiger tiger","note":"A folk story tells of a painter who mixed a horse and a tiger in one picture; 马虎 came to mean careless. Doubled, it means 'meh, so-so'. Four-character sayings like this are everywhere in Chinese.","pos":"idiom","topic":"Feelings"},
{"id":"s_it_01","lang":"it","type":"word","en":"Hi / Bye (informal)","target":"Ciao","literal":"(I am your) slave","note":"From Venetian 's-ciào vostro' (your slave), a bow-and-scrape greeting like English 'your servant'. 'Schiavo' (slave) and 'Slav' share a root. Used for hello and goodbye, only with people you address as 'tu'.","pos":"greeting","topic":"Greetings"},
{"id":"s_it_02","lang":"it","type":"word","en":"Thank you","target":"Grazie","literal":"graces, thanks","note":"The plural of 'grazia' (grace, favour), from Latin 'gratia'. 'Grazie mille' is 'a thousand thanks'. The reply is 'prego'.","pos":"interjection","topic":"Greetings"},
{"id":"s_it_03","lang":"it","type":"word","en":"You're welcome / Please (go ahead) / Pardon?","target":"Prego","literal":"I pray, I beg","note":"First person of 'pregare' (to pray, to beg). One word for 'you're welcome', 'after you', 'please sit down' and 'sorry, what?', depending on tone.","pos":"verb","topic":"Greetings"},
{"id":"s_it_04","lang":"it","type":"word","en":"Good day / Good morning","target":"Buongiorno","literal":"good day","note":"'Buon' + 'giorno' fused. Used until early afternoon; then 'buonasera'. 'Buonanotte' is only for going to bed.","pos":"greeting","topic":"Greetings"},
{"id":"s_it_05","lang":"it","type":"word","en":"Goodbye","target":"Arrivederci","literal":"until we see each other again","note":"'A' (until) + 'rivederci' (to see each other again). The formal version to one person is 'arrivederLa'.","pos":"greeting","topic":"Greetings"},
{"id":"s_it_06","lang":"it","type":"phrase","en":"Good luck","target":"In bocca al lupo","literal":"into the mouth of the wolf","note":"Said before an exam or a performance, like 'break a leg'. The required answer is 'Crepi!' (may it die), never 'grazie'.","pos":"phrase","topic":"Feelings"},
{"id":"s_it_07","lang":"it","type":"word","en":"Friend","target":"amico","literal":"friend","note":"From Latin 'amicus', from 'amare' (to love). Masculine -o, feminine -a, plurals 'amici' / 'amiche' with the spelling change that keeps the 'k' sound.","pos":"noun","topic":"Family & people","gender":{"m":{"target":"amico"},"f":{"target":"amica"}}},
{"id":"s_it_08","lang":"it","type":"word","en":"To be","target":"essere","literal":"to be","note":"'Sono' is both 'I am' and 'they are'; context decides. Italian drops subject pronouns because the ending already says who.","pos":"verb","topic":"Verbs of daily life","conj":[{"label":"I","target":"sono"},{"label":"you (sg.)","target":"sei"},{"label":"he / she","target":"è"},{"label":"we","target":"siamo"},{"label":"you (pl.)","target":"siete"},{"label":"they","target":"sono"}]},
{"id":"s_es_01","lang":"es","type":"word","en":"Hello","target":"Hola","literal":"hello","note":"The h is silent: 'o-la'. Its origin is uncertain; a link to Arabic 'wa-llāh' (by God) is often claimed but not proven. Works at any time of day.","pos":"greeting","topic":"Greetings"},
{"id":"s_es_02","lang":"es","type":"word","en":"Thank you","target":"Gracias","literal":"graces, thanks","note":"Plural of 'gracia', from Latin 'gratia'. 'Muchas gracias' is the warmer form. The reply is 'de nada'.","pos":"interjection","topic":"Greetings"},
{"id":"s_es_03","lang":"es","type":"phrase","en":"Please","target":"Por favor","literal":"by favour","note":"'Por' (by, through) + 'favor'. Spanish uses it less often than English uses 'please'; the polite verb form 'quería' or 'me pone' does the work instead.","pos":"phrase","topic":"Greetings"},
{"id":"s_es_04","lang":"es","type":"phrase","en":"Good morning","target":"Buenos días","literal":"good days","note":"Plural, probably short for 'buenos días os dé Dios' (may God give you good days). 'Buenas tardes' from lunchtime, 'buenas noches' after dark.","pos":"greeting","topic":"Greetings"},
{"id":"s_es_05","lang":"es","type":"word","en":"Goodbye","target":"Adiós","literal":"to God","note":"'A Dios' (to God), short for 'I commend you to God', like French 'adieu'. For a casual bye use 'hasta luego' (until later) or 'chao'.","pos":"greeting","topic":"Greetings"},
{"id":"s_es_06","lang":"es","type":"phrase","en":"I'm sorry","target":"Lo siento","literal":"I feel it","note":"'Sentir' is to feel; 'lo siento' means 'I feel it (your pain)'. For bumping into someone say 'perdón' or 'disculpe'.","pos":"phrase","topic":"Greetings"},
{"id":"s_es_07","lang":"es","type":"word","en":"Friend","target":"amigo","literal":"friend","note":"From Latin 'amicus'. The -o/-a pair is the basic Spanish gender pattern; a mixed group is 'amigos'.","pos":"noun","topic":"Family & people","gender":{"m":{"target":"amigo"},"f":{"target":"amiga"}}},
{"id":"s_es_08","lang":"es","type":"word","en":"To be (permanent)","target":"ser","literal":"to be","note":"Spanish has two verbs for 'to be': 'ser' for identity and permanent traits, 'estar' for location and states. 'Soy' comes from Latin 'sum', 'eres' from 'eris'.","pos":"verb","topic":"Verbs of daily life","conj":[{"label":"I","target":"soy"},{"label":"you (sg.)","target":"eres"},{"label":"he / she / usted","target":"es"},{"label":"we","target":"somos"},{"label":"you (pl., Spain)","target":"sois"},{"label":"they / ustedes","target":"son"}]},
{"id":"s_fr_01","lang":"fr","type":"word","en":"Hello / Good day","target":"Bonjour","literal":"good day","note":"'Bon' + 'jour'. Say it once per person per day; a second 'bonjour' to the same person sounds odd, so people say 'rebonjour' as a joke. After about 6 pm, 'bonsoir'.","pos":"greeting","topic":"Greetings"},
{"id":"s_fr_02","lang":"fr","type":"word","en":"Thank you","target":"Merci","literal":"mercy, reward","note":"From Latin 'mercedem' (wages, reward, favour). The same word gives English 'mercy' and the phrase 'at the mercy of'. The reply is 'de rien' or 'je vous en prie'.","pos":"interjection","topic":"Greetings"},
{"id":"s_fr_03","lang":"fr","type":"phrase","en":"Please (formal)","target":"S'il vous plaît","literal":"if it pleases you","note":"'Si' + 'il' + 'vous' + 'plaît' (from plaire, to please). The informal version is 's'il te plaît'. Abbreviated SVP on signs.","pos":"phrase","topic":"Greetings"},
{"id":"s_fr_04","lang":"fr","type":"phrase","en":"Goodbye","target":"Au revoir","literal":"to the seeing-again","note":"'Au' (to the) + 'revoir' (to see again). 'Adieu' (to God) is only for final farewells. Friends say 'salut' or 'à plus'.","pos":"greeting","topic":"Greetings"},
{"id":"s_fr_05","lang":"fr","type":"phrase","en":"You're welcome","target":"De rien","literal":"of nothing","note":"'Rien' comes from Latin 'rem' (a thing), so 'nothing' in French is literally 'a thing' that negation turned inside out. 'Je vous en prie' is the formal reply.","pos":"phrase","topic":"Greetings"},
{"id":"s_fr_06","lang":"fr","type":"phrase","en":"How's it going?","target":"Ça va ?","literal":"that goes?","note":"'Ça' (that) + 'va' (goes). The answer is also 'ça va'. The space before the question mark is standard French typography.","pos":"phrase","topic":"Greetings"},
{"id":"s_fr_07","lang":"fr","type":"word","en":"Friend","target":"ami","literal":"friend","note":"From Latin 'amicus'. The feminine adds -e, which is silent but changes 'un ami' to 'une amie'. 'Mon amie' is used even though 'amie' is feminine, because 'ma' cannot stand before a vowel.","pos":"noun","topic":"Family & people","gender":{"m":{"target":"ami"},"f":{"target":"amie"}}},
{"id":"s_fr_08","lang":"fr","type":"word","en":"To be","target":"être","literal":"to be","note":"The circumflex marks a lost s: Old French 'estre', from Latin 'esse'. 'Es' and 'est' sound the same; only spelling tells 'tu es' from 'il est'.","pos":"verb","topic":"Verbs of daily life","conj":[{"label":"I","target":"je suis"},{"label":"you (sg.)","target":"tu es"},{"label":"he / she","target":"il / elle est"},{"label":"we","target":"nous sommes"},{"label":"you (pl. / formal)","target":"vous êtes"},{"label":"they","target":"ils / elles sont"}]},
{"id":"s_nl_01","lang":"nl","type":"word","en":"Hello","target":"Hallo","literal":"hello","note":"The all-purpose greeting. 'Hoi' is the casual one, 'goedemorgen' / 'goedemiddag' / 'goedenavond' the polite ones by time of day. 'Dag!' works for both hello and bye.","pos":"greeting","topic":"Greetings"},
{"id":"s_nl_02","lang":"nl","type":"phrase","en":"Thank you","target":"Dank je wel","literal":"thank you well","note":"'Dank' + 'je' (you) + 'wel' (well, indeed). The polite form is 'dank u wel'; 'bedankt' is the quick everyday version.","pos":"phrase","topic":"Greetings"},
{"id":"s_nl_03","lang":"nl","type":"word","en":"Please / Here you are","target":"Alsjeblieft","literal":"if it pleases you","note":"'Als het je belieft' squeezed into one word, exactly parallel to French 's'il te plaît'. Said when asking and when handing something over. Polite form: 'alstublieft'.","pos":"interjection","topic":"Greetings"},
{"id":"s_nl_04","lang":"nl","type":"phrase","en":"Goodbye","target":"Tot ziens","literal":"until seeing","note":"'Tot' (until) + 'ziens' (an old genitive of 'zien', to see). Casual alternatives: 'doei', 'doeg', 'later'.","pos":"greeting","topic":"Greetings"},
{"id":"s_nl_05","lang":"nl","type":"word","en":"Cosy, convivial, pleasant","target":"gezellig","literal":"companion-like","note":"From 'gezel' (companion, journeyman), the same root as German 'Geselle'. Describes a warm café, a good evening with friends, a room, a person. Famously untranslatable.","pos":"adjective","topic":"Feelings"},
{"id":"s_nl_06","lang":"nl","type":"word","en":"Tasty, nice, lovely","target":"lekker","literal":"tasty","note":"Starts with food but spreads to everything pleasant: 'lekker weer' (nice weather), 'lekker slapen' (sleep well), 'lekker bezig' (nice going, often ironic).","pos":"adjective","topic":"Food & drink"},
{"id":"s_nl_07","lang":"nl","type":"word","en":"Friend","target":"vriend","literal":"friend","note":"Cognate with English 'friend'. 'Vriendin' is a female friend and also 'girlfriend'; context decides. 'Mijn vriend' from a woman usually means boyfriend.","pos":"noun","topic":"Family & people","gender":{"m":{"target":"vriend"},"f":{"target":"vriendin"}}},
{"id":"s_nl_08","lang":"nl","type":"word","en":"To be","target":"zijn","literal":"to be","note":"'Ik ben' and English 'I am' share the Germanic root; 'is' is identical in both languages. 'Zijn' is also the word for 'his'.","pos":"verb","topic":"Verbs of daily life","conj":[{"label":"I","target":"ik ben"},{"label":"you (sg.)","target":"jij bent"},{"label":"he / she","target":"hij / zij is"},{"label":"we","target":"wij zijn"},{"label":"you (pl.)","target":"jullie zijn"},{"label":"they","target":"zij zijn"}]},
{"id":"s_en_01","lang":"en","type":"word","en":"present or found everywhere","target":"ubiquitous","literal":"everywhere-ish","note":"From Latin 'ubique' (everywhere), coined in English in the 1800s from the theological 'ubiquity' of God. Formal; collocates with 'smartphones', 'presence', 'become'.","pos":"adjective","topic":"Formal & academic vocabulary"},
{"id":"s_en_02","lang":"en","type":"phrase","en":"to make a small supply last by careful use","target":"to eke out","literal":"to increase out","note":"'Eke' is Old English 'ēcan', to increase (same root as 'nickname', from 'an eke-name'). Today it survives only in this phrasal verb: 'eke out a living', 'eke out a narrow win'.","pos":"verb","topic":"Phrasal verbs: everyday life","conj":[{"label":"past","target":"eked out"},{"label":"participle","target":"eking out"},{"label":"pattern","target":"eke out a living / an existence / a win"}]},
{"id":"s_en_03","lang":"en","type":"phrase","en":"a question open to debate, or (US) one no longer relevant","target":"a moot point","literal":"a meeting point","note":"'Moot' is Old English 'gemōt', an assembly where cases were argued; law students still hold 'moot courts'. British usage: debatable. American usage: irrelevant. Often mis-spelled 'mute point'.","pos":"noun","topic":"Idioms & fixed expressions"},
{"id":"s_en_04","lang":"en","type":"word","en":"the luck of finding good things by chance","target":"serendipity","literal":"the quality of Serendip","note":"Coined in 1754 by Horace Walpole after the fairy tale 'The Three Princes of Serendip' (an old name for Sri Lanka), whose heroes kept making lucky discoveries. Voted one of the hardest English words to translate.","pos":"noun","topic":"Rare but useful words"},
{"id":"s_en_05","lang":"en","type":"word","en":"in spite of; nevertheless","target":"notwithstanding","literal":"not standing against","note":"Formal and legal. 'Withstand' means to resist, so 'notwithstanding X' is 'X not resisting (this)'. Unusually, it can follow its noun: 'the weather notwithstanding'.","pos":"preposition","topic":"Adverbs & discourse markers"},
{"id":"s_en_06","lang":"en","type":"phrase","en":"to suffer the worst part of something","target":"to bear the brunt of","literal":"to carry the main force of the blow","note":"'Brunt' (the shock of an attack) is of uncertain origin, possibly Old Norse. Only ever used in this phrase: 'small businesses bore the brunt of the recession'.","pos":"phrase","topic":"Idioms & fixed expressions","conj":[{"label":"past","target":"bore the brunt of"},{"label":"participle","target":"has borne the brunt of"}]},
{"id":"s_en_07","lang":"en","type":"word","en":"the most perfect or typical example of something","target":"quintessential","literal":"of the fifth essence","note":"Medieval alchemists added a fifth essence, aether, to earth, air, fire and water: the purest substance of all. 'The quintessential English village'. Stress on the third syllable.","pos":"adjective","topic":"Near-synonyms & nuance"},
{"id":"s_en_08","lang":"en","type":"phrase","en":"to reduce activity gradually before stopping; to relax","target":"to wind down","literal":"to turn a crank downwards","note":"From winding a clock or a car window. Rhymes with 'find', not 'tinned'. Separable: 'wind the business down'. Opposite 'wind up', which also means to tease someone (British).","pos":"verb","topic":"Phrasal verbs: everyday life","conj":[{"label":"past","target":"wound down"},{"label":"separable","target":"wind it down"},{"label":"opposite","target":"wind up"}]}];

ar: {title:"Arabic abjad (28 letters)", items:[
["ا","alif","ā / a","The first letter, a plain vertical stroke. Usually carries a long 'ā'; with hamza (أ إ) it is a glottal stop."],
["ب","bāʾ","b","One dot below. The 'b' sound. Its basic shape, a shallow bowl, is shared with ت ث ن ي and only the dots tell them apart."],
["ت","tāʾ","t","Two dots above on the same bowl as bāʾ. The looped form ة (tāʾ marbūṭa, 'tied tāʾ') marks feminine nouns."],
["ث","thāʾ","th (as in 'think')","Three dots above. In Egyptian dialect it is often pronounced 's' or 't'."],
["ج","jīm","j","One dot below. In Egypt it is pronounced as a hard 'g'. Shares its shape with ح and خ."],
["ح","ḥāʾ","ḥ (breathy h)","No dots. A strong, whispered 'h' from the throat, as in 'Muḥammad'. Hard for English speakers; practise it as a loud sigh."],
["خ","khāʾ","kh (as in Scottish 'loch')","One dot above. The scraping sound at the back of the mouth."],
["د","dāl","d","Does not connect to the following letter, so words often break after it."],
["ذ","dhāl","dh (as in 'this')","Dāl with a dot above. Also non-connecting."],
["ر","rāʾ","r (rolled)","A tapped or rolled 'r'. Non-connecting."],
["ز","zāy","z","Rāʾ with a dot above. Non-connecting."],
["س","sīn","s","Three small teeth. Handwriting often flattens them into a single line."],
["ش","shīn","sh","Sīn with three dots above."],
["ص","ṣād","ṣ (emphatic s)","An 'emphatic' consonant: pronounced with the tongue pulled back, which darkens the vowels around it."],
["ض","ḍād","ḍ (emphatic d)","Arabic is nicknamed 'the language of the ḍād' because this sound is thought to exist in no other language."],
["ط","ṭāʾ","ṭ (emphatic t)","The tall stroke on a loop. Emphatic cousin of ت."],
["ظ","ẓāʾ","ẓ (emphatic dh)","Ṭāʾ with a dot. Rare; in many dialects it merges with ض."],
["ع","ʿayn","ʿ (voiced throat sound)","The letter with no English equivalent: a tightening of the throat. Often shown as ' or 3 in chat Arabic ('3arabi')."],
["غ","ghayn","gh (like French r)","ʿayn with a dot above. The sound of gargling, close to a Parisian 'r'."],
["ف","fāʾ","f","One dot above. In Maghrebi scripts the dot sits below instead."],
["ق","qāf","q (deep k)","A 'k' made far back in the throat. Two dots above. In many cities it is pronounced as a glottal stop: 'qalb' (heart) becomes 'alb'."],
["ك","kāf","k","Takes a different, taller shape when it stands alone or at the end of a word."],
["ل","lām","l","With alif it forms the ligature لا, which looks like a separate letter and is taught as one."],
["م","mīm","m","A small loop with a tail. Its initial form is just the loop."],
["ن","nūn","n","One dot above the same bowl as ب. At the end of a word the bowl deepens into a cup."],
["ه","hāʾ","h","Changes shape dramatically: ه alone, هـ at the start, ـهـ in the middle (a tiny figure eight), ـه at the end."],
["و","wāw","w / ū","A consonant 'w' or the long vowel 'ū'. Non-connecting. Also the word 'and'."],
["ي","yāʾ","y / ī","A consonant 'y' or the long vowel 'ī'. Two dots below. At the end of a word the dots are often dropped in Egypt."]
]},

hi: {title:"Devanagari (vowels and consonants)", items:[
["अ","a","a","The inherent vowel. Every consonant letter already contains a short 'a' unless another vowel sign or a virāma (्) removes it."],["आ","ā","ā","Long 'a', as in 'father'. As a sign after a consonant it is a vertical bar: का 'kā'."],["इ","i","i","Short 'i'. Its sign ि is written before the consonant but pronounced after it: कि 'ki'."],["ई","ī","ī","Long 'ī'; sign ी follows the consonant."],["उ","u","u","Sign ु hangs below: कु 'ku'."],["ऊ","ū","ū","Sign ू below."],["ऋ","ṛ","ri","A Sanskrit vocalic 'r', pronounced 'ri' in Hindi: ऋषि 'rishi'."],["ए","e","e","Always long, as in 'say' without the glide."],["ऐ","ai","ai","In Hindi closer to the 'a' in 'cat' than a true diphthong."],["ओ","o","o","Sign ो."],["औ","au","au","Closer to the 'o' in 'hot' than 'ow'."],["अं","aṃ (anusvāra)","am / an","The dot above nasalizes or adds a nasal consonant: हिंदी 'Hindī'."],["अः","aḥ (visarga)","ah","A breath after the vowel; rare outside Sanskrit words."],
["क","ka","ka","Velar row: made at the back of the mouth. Devanagari orders consonants by where in the mouth they are made, from the throat forward, a system worked out by Sanskrit grammarians over two thousand years ago."],["ख","kha","kha","Aspirated 'k': a puff of air follows. Aspiration is contrastive: खाना 'khānā' (food) vs. काना 'kānā' (one-eyed)."],["ग","ga","ga","Voiced velar."],["घ","gha","gha","Voiced and aspirated."],["ङ","ṅa","nga","The 'ng' of 'sing'. Rare as a standalone letter."],
["च","ca","cha","Palatal row, made with the tongue against the palate. Pronounced like 'ch' in 'church'."],["छ","cha","chha","Aspirated 'ch'."],["ज","ja","ja","With a dot below (ज़) it becomes 'z' for Persian and English loans."],["झ","jha","jha","Voiced aspirated 'j'."],["ञ","ña","nya","The 'ny' of 'canyon'. Mostly appears in conjuncts."],
["ट","ṭa","ṭa","Retroflex row: the tongue curls back to touch the roof of the mouth. This gives Indian English its characteristic 't' and 'd'."],["ठ","ṭha","ṭha","Aspirated retroflex."],["ड","ḍa","ḍa","With a dot below (ड़) it becomes the flapped 'ṛ' of लड़का."],["ढ","ḍha","ḍha","With a dot (ढ़) it becomes 'ṛh', as in पढ़ना 'paṛhnā' (to read)."],["ण","ṇa","ṇa","Retroflex 'n'; many speakers pronounce it like न."],

zh: {title:"Pinyin tones and common radicals", items:[
["mā","first tone (high, flat)","mā","妈 (mother). The tone mark is a flat bar. Mandarin has four tones plus a neutral one; the same syllable 'ma' with different tones means mother, hemp, horse or scold."],["má","second tone (rising)","má","麻 (hemp). Rises like a question in English."],["mǎ","third tone (dipping)","mǎ","马 (horse). Falls then rises; in fast speech often just low. Two third tones in a row: the first becomes second tone (你好 'ní hǎo')."],["mà","fourth tone (falling)","mà","骂 (to scold). Sharp and falling, like a command."],["ma","neutral tone","ma","吗 (question particle). Short and light, no mark."],
["人","rén","rén","Person. Two strokes: a figure walking. As a radical on the left it becomes 亻, as in 你 (you) and 他 (he)."],["口","kǒu","kǒu","Mouth. A square opening. Appears in 吃 (eat), 叫 (call) and 吗 (question particle)."],["日","rì","rì","Sun, day. Originally a circle with a dot. In 明 (bright) it sits beside the moon."],["月","yuè","yuè","Moon, month. A crescent. Also used as the 'flesh' radical in body parts: 脸 (face), 脚 (foot)."],["水","shuǐ","shuǐ","Water. A flowing stream. As a radical it becomes three drops 氵: 河 (river), 海 (sea), 洗 (wash)."],["火","huǒ","huǒ","Fire. Flames rising. Below a character it becomes four dots 灬: 热 (hot), 点 (dot)."],["木","mù","mù","Tree, wood. A trunk with branches and roots. Two trees 林 is a grove, three 森 is a forest."],["土","tǔ","tǔ","Earth, soil. A mound on the ground. In 地 (ground) and 坐 (sit, two people on the earth)."],["金","jīn","jīn","Metal, gold. As a radical 钅 it marks metals and money: 钱 (money), 铁 (iron)."],["山","shān","shān","Mountain. Three peaks. 出 (to go out) is a foot leaving a cave, often misread as two mountains."],["心","xīn","xīn","Heart. A picture of the organ. As a radical 忄 it marks feelings: 怕 (fear), 快 (happy, fast). 想 (to think) has a heart underneath."],["手","shǒu","shǒu","Hand. Five fingers. As a radical 扌 it marks actions done by hand: 打 (hit), 找 (look for), 拿 (take)."],["女","nǚ","nǚ","Woman. A kneeling figure. In 好 (good), 妈 (mother), 她 (she)."],["子","zǐ","zǐ","Child. A baby with outstretched arms. In 学 (study) and 字 (character: a child under a roof)."],["大","dà","dà","Big. A person with arms stretched wide. 太 (too much) adds a dot."],["小","xiǎo","xiǎo","Small. Three small strokes. 少 (few) adds a slash."],["门","mén","mén","Door, gate. The simplified form of 門, two swinging doors. 问 (to ask) is a mouth at the gate."],["车","chē","chē","Vehicle. Simplified from 車, a cart seen from above with its axle."],["言","yán","yán","Speech. A mouth with sound lines. As a radical 讠 it marks words: 说 (speak), 语 (language), 谢 (thank)."],["食","shí","shí","To eat, food. A lid over a bowl of rice. As a radical 饣: 饭 (rice, meal), 饿 (hungry)."],["马","mǎ","mǎ","Horse. Simplified from 馬, with its mane and four legs. The phonetic in 妈 (mother) and 吗 (question)."],["鸟","niǎo","niǎo","Bird. Simplified from 鳥. 鸡 (chicken), 鸭 (duck)."],["鱼","yú","yú","Fish. Simplified from 魚, head, body and tail. Sounds like 余 (surplus), so fish is served at New Year for 'surplus every year'."],["田","tián","tián","Field. Irrigation channels dividing a plot. In 男 (man): strength 力 in the field."],["目","mù","mù","Eye. An eye turned on its side. 看 (to look) is a hand shading the eye."],["耳","ěr","ěr","Ear. In 听 (listen) and 闻 (hear, smell)."],["足","zú","zú","Foot. In 跑 (run) and 跳 (jump)."],["雨","yǔ","yǔ","Rain. Drops under a cloud. 雪 (snow), 雷 (thunder), 电 (electricity, from lightning)."],["力","lì","lì","Strength. A flexed arm or a plough. 加 (to add) is strength plus mouth."],["刀","dāo","dāo","Knife. As a radical 刂 on the right: 分 (divide), 到 (arrive)."]
]},

pl: {title:"Polish alphabet (32 letters and digraphs)", items:[

["ch","ce-ha","kh","Digraph, same sound as 'h'."],["cz","ce-zet","ch (hard)","'Czas' (time) is 'chas'."],["dz","de-zet","dz","One sound, like 'ds' in 'adds'."],["dź","de-ziet","j (soft)","'Dźwięk' (sound)."],["dż","de-żet","j (hard)","'Dżem' (jam)."],["rz","er-zet","zh","Same as 'ż'; historically a soft 'r', which is why Polish 'rzeka' matches Czech 'řeka' (river)."],["sz","es-zet","sh (hard)","'Szkoła' (school). Together with 'cz' and 'rz' this is what makes Polish look full of consonants."]

d as b."],["W w","uve doble","w","Loanwords only."],["X x","equis","ks / s / kh","'ks' usually (examen); 'kh' in old spellings of Mexican names: México, Oaxaca ('wa-HA-ka')."],["Y y","i griega / ye","y / ee","A consonant like English 'y' (yo), or the vowel 'i' in 'y' (and) and at the end of words (hoy). In Argentina it sounds like 'sh'."],["Z z","zeta","th (Spain) / s (Latin America)","'Zapato' is 'thapato' in Madrid and 'sapato' in Mexico. Never a buzzing 'z'."],
